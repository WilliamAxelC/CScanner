name: Build CScanner (Web PWA & Android APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Build Web PWA
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: pnpm build:web

      - name: Upload Web PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: cscanner-web-pwa
          path: dist/

  android-apk:
    runs-on: ubuntu-latest
    needs: verify-and-web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean

      - name: Run CScannerMlkit Kotlin unit tests
        run: |
          cd android
          ./gradlew :cscanner-mlkit:testDebugUnitTest --no-daemon

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          mkdir -p build-output
          # Expo's release build signs with the public debug key; re-sign it with CScanner's private key so
          # in-app updates install over the previous version and nobody else can sign an "update".
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$SRC" ] || SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cscanner-release.keystore"
            export ANDROID_KEY_PASS="${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/cscanner-release.keystore" --ks-key-alias "${ANDROID_KEY_ALIAS:-cscanner}" \
              --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEY_PASS \
              --out build-output/CScanner-release.apk "$SRC"
            rm -f "$RUNNER_TEMP/cscanner-release.keystore"
          elif [ "$IS_TAG" = "true" ]; then
            echo "ERROR: release tags need the ANDROID_KEYSTORE_* secrets; refusing to publish a debug-signed APK." >&2
            exit 1
          else
            echo "WARNING: no release key (not a tag build); this APK keeps the debug signature."
            cp "$SRC" build-output/CScanner-release.apk
          fi
          ls -lh build-output/

      - name: Verify Release APK (size, ABI, compression, R8 keep rules, manifest security, signature)
        run: |
          python3 - << 'PYEOF'
          import os, zipfile

          apk = "build-output/CScanner-release.apk"
          size = os.path.getsize(apk)
          print(f"APK size: {size} bytes ({size / (1024 * 1024):.2f} MB)")
          assert size < 35 * 1024 * 1024, f"APK too large: {size} bytes"

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              bad_abis = [n for n in names if n.startswith("lib/") and not n.startswith("lib/arm64-v8a/")]
              assert not bad_abis, f"Unexpected ABI libs present: {bad_abis[:5]}"
              arm64_sos = [i for i in z.infolist() if i.filename.startswith("lib/arm64-v8a/") and i.filename.endswith(".so")]
              assert len(arm64_sos) > 0, "No arm64-v8a .so libs found!"
              stored_sos = [i.filename for i in arm64_sos if i.compress_type == zipfile.ZIP_STORED]
              assert not stored_sos, f"Uncompressed .so found (useLegacyPackaging failed): {stored_sos[:5]}"

              dex_bytes = b"".join(z.read(n) for n in names if n.endswith(".dex"))
              for required in [
                  b"Lcom/cscanner/mlkit/CScannerMlkitModule;",
                  b"Lcom/google/mlkit/vision/documentscanner/GmsDocumentScannerOptions;",
                  b"Lcom/google/mlkit/vision/documentscanner/internal/GmsDocumentScanningDelegateActivity;",
              ]:
                  assert required in dex_bytes, f"Missing kept class in dex: {required.decode()}"
          print("APK structure, compression, ABI, and R8 keep checks passed!")
          PYEOF

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose build-output/CScanner-release.apk
          CERTS=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs build-output/CScanner-release.apk)
          echo "$CERTS" | grep -E "DN|SHA-256"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "ERROR: release APK is signed with the public debug key!" >&2
            exit 1
          fi
          if ! "$AAPT2" dump badging build-output/CScanner-release.apk | grep -q "package: name='dev.cuang.cscanner'"; then
            echo "ERROR: APK package name is not dev.cuang.cscanner!" >&2
            exit 1
          fi
          "$AAPT2" dump badging build-output/CScanner-release.apk | head -n 5
          PERMS=$("$AAPT2" dump permissions build-output/CScanner-release.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -q "RECORD_AUDIO"; then
            echo "ERROR: Unused RECORD_AUDIO permission leaked into APK!" >&2
            exit 1
          fi
          XMLTREE=$("$AAPT2" dump xmltree build-output/CScanner-release.apk --file AndroidManifest.xml)
          echo "$XMLTREE" | grep -E "allowBackup|usesCleartextTraffic|package=" | head -n 10
          if ! echo "$XMLTREE" | grep -q "allowBackup.*=false"; then
            echo "ERROR: android:allowBackup is not false in AndroidManifest.xml!" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cscanner-android-apk
          path: build-output/CScanner-release.apk

  release:
    runs-on: ubuntu-latest
    needs: android-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cscanner-android-apk
          path: build-output/

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CScanner-release.apk
