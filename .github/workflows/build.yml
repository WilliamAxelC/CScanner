name: Build CScanner (Web PWA & Android APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Build Web PWA
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: pnpm build:web

      - name: Upload Web PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: cscanner-web-pwa
          path: dist/

  android-apk:
    runs-on: ubuntu-latest
    needs: verify-and-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign or prepare sideloadable APK
        run: |
          mkdir -p build-output
          APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" build-output/CScanner-release.apk
          elif [ -f "$APK_PATH" ]; then
            # Fallback debug-signed release APK for personal sideloading when no release keystore secret is configured
            keytool -genkey -v -keystore /tmp/cscanner-ci.keystore -alias cscanner -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CScanner,O=CScanner,C=US"
            BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks /tmp/cscanner-ci.keystore --ks-pass pass:android --key-pass pass:android --out build-output/CScanner-release.apk "$APK_PATH"
          fi
          ls -lh build-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cscanner-android-apk
          path: build-output/CScanner-release.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CScanner-release.apk
